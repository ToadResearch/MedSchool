# flow:
#   db (Postgres) becomes healthy.
#   hapi waits for db → becomes healthy.
#   validator (HL7 validator-wrapper) waits for hapi → starts.
#   uploader waits for hapi → runs one-shot to load data (optional).
#   mcp waits for hapi → becomes healthy.
#   sandbox waits for mcp → becomes healthy.
#   prewarm waits for validator → runs one-shot to prewarm the validator.

services:

  db:
    image: postgres:15
    container_name: medschool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      # data persists in this volume
      - pgdata:/var/lib/postgresql/data
    networks:
      - medschool-net
    # ports:
    #   # only open port during testing
    #   - "${DB_PORT}:${DB_CONTAINER_PORT}"

  hapi:
    mem_limit: 6g # compose (non-swarm) memory limit for this container
    build:
      context: ./docker/fhir_server
    container_name: medschool-hapi
    depends_on:
      db:
        # hapi will wait until db is ready before starting
        condition: service_healthy 
    restart: unless-stopped
    environment:
      # initial heap of 2GiB and max of 4GiB, exits onOOM
      # JAVA_TOOL_OPTIONS: "-Xms2g -Xmx4g -XX:+ExitOnOutOfMemoryError"
      # initial heap of 50% and max of 70% of the container's memory, exits on OOM
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      # - spring.jpa.properties.hibernate.dialect=ca.uhn.fhir.jpa.model.dialect.PostgresDialect
      # - spring.jpa.properties.hibernate.dialect=ca.uhn.fhir.jpa.model.dialect.Postgres94Dialect
      # - spring.datasource.url=jdbc:postgresql://postgres:5432/fhir
      # local config file path for hapi to load from
      
      # replaces the default config file location -- must be correct path -- fails :(
      # SPRING_CONFIG_LOCATION: "file:/app/config/application.yaml" # 
      
      # adds additional search locations for the application.yaml file -- works :)
      SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/app/config/"  

      # remote when TERMINOLOGY_MODE=remote, else false
      REMOTE_TS_ENABLED: ${REMOTE_TS_ENABLED}
      REMOTE_TS_BASE: ${REMOTE_TS_BASE}
      LOCAL_ADDRESS: ${LOCAL_ADDRESS}

    volumes:
      # inject local config file into container (local file path and container path), ro for read only
      - ./docker/fhir_server/config/application.yaml:/app/config/application.yaml:ro
      # Optional but useful if you enable Lucene later and bulk export
      # - hapi_appdata:/app/target
    healthcheck:
      # once the metadata is available, we know the server is running
      # busybox wget added to the hapi image in Dockerfile for healthcheck
      test: ["CMD", "/busybox", "nc", "-z", "127.0.0.1", "${HAPI_CONTAINER_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      - medschool-net
    # ports:
    #   - "${HAPI_PORT}:${HAPI_CONTAINER_PORT}"

  validator:
    build:
      context: ./docker/val_server
    container_name: medschool-fhir-validator
    restart: unless-stopped
    environment:
      # Optional: tweak/disable prewarm without rebuilding
      - TX_SERVER_URL=${TX_SERVER_URL:-https://tx.fhir.org}
      - VALIDATOR_PREWARM=${VALIDATOR_PREWARM:-true}
      - VALIDATOR_PREWARM_SV=${VALIDATOR_PREWARM_SV:-4.0.1}
      - VALIDATOR_PREWARM_TIMEOUT=${VALIDATOR_PREWARM_TIMEOUT:-90}
      - VALIDATOR_STARTUP_WAIT=${VALIDATOR_STARTUP_WAIT:-30}
      - LOCAL_ADDRESS=${LOCAL_ADDRESS}
    networks:
      - medschool-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${VALIDATOR_CONTAINER_PORT}/versions >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      hapi:
        # because we need validator to download some fhir stuff via prewarm
        # we'll just wait for hapi to have started so everything happens in parallel
        condition: service_started

  # One-shot job that warms the validator after it's healthy
  validator-prewarm:
    image: curlimages/curl:8.8.0
    container_name: medschool-validator-prewarm
    depends_on:
      validator:
        condition: service_started
    command: ["sh", "-eux", "/scripts/prewarm.sh"]
    environment:
      VALIDATOR_HOST: validator
      VALIDATOR_PORT: ${VALIDATOR_CONTAINER_PORT}
      VALIDATOR_SV: "4.0.1"
      PREWARM_TIMEOUT_SECS: "180"
    volumes:
      - ./docker/val_server/scripts/prewarm.sh:/scripts/prewarm.sh:ro
    networks: [medschool-net]
    restart: "no"


  sandbox:
    build:
      context: ./docker/sandbox
    image: medschool-sandbox
    container_name: medschool-sandbox
    restart: unless-stopped
    environment:
      SANDBOX_IMAGE: "medschool-sandbox"
      # Optional: enable gVisor if installed on the host: SANDBOX_RUNTIME=runsc
      # SANDBOX_RUNTIME: "runsc"
      LOCAL_ADDRESS: ${LOCAL_ADDRESS}
      SANDBOX_EXEC_TIMEOUT_S: ${SANDBOX_EXEC_TIMEOUT_S}
      SANDBOX_EXEC_MEM_MB: ${SANDBOX_EXEC_MEM_MB}
      SANDBOX_EXEC_CPUS: ${SANDBOX_EXEC_CPUS}
    networks: [medschool-net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${SANDBOX_PORT}:${SANDBOX_CONTAINER_PORT}"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SANDBOX_CONTAINER_PORT}/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30


  uploader:
    build:
      context: ./docker/uploader
    container_name: medschool-uploader
    depends_on:
      # uploader will wait until hapi is ready before starting
      # because the hapi server needs to be up before uploading anything!
      hapi:
        condition: service_healthy
      middleman:
        condition: service_healthy
    environment:  # TODO: works fine with HAPI_INTERNAL_FHIR_BASE, but drops lots of synthea records with current setup. i think there are network traffic issues
      FHIR_BASE_URL: ${FHIR_PROXY_INTERNAL_BASE}/fhir # never used by client machine, so just use internal url
      SYNTHEA_ZIP_URL: ${SYNTHEA_ZIP_URL}
    networks:
      - medschool-net
    restart: "no"

  # termloader:
  #   build:
  #     context: ./docker/term_loader
  #     args:
  #       HAPI_VERSION: ${HAPI_VERSION:-8.6.0}
  #   environment:
  #     TARGET_FHIR_BASE: http://hapi:${HAPI_CONTAINER_PORT}/fhir   # inside the compose network, no auth needed
  #     JAVA_TOOL_OPTIONS: "-Xms1g -Xmx6g"
  #   depends_on:
  #     - hapi
  #   volumes:
  #     - ./data/terminology:/data:ro
  #   restart: "no"


  mcp:
    build:
      context: ./docker/mcp_server
    container_name: medschool-mcp
    restart: unless-stopped
    depends_on:
      hapi:
        condition: service_healthy
      middleman:
        condition: service_healthy
    environment:
      MCP_HOST: ${MCP_HOST}
      MCP_CONTAINER_PORT: ${MCP_CONTAINER_PORT}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH}
      
      # the external port on the host machine or other to bind to 
      LOOPBACK_HOST: ${LOOPBACK_HOST}

      # not used: canonical client URLs from .env if calling from host machine external to docker
      FHIR_BASE_URL: ${FHIR_BASE_URL}
      TERMINOLOGY_BASE_URL: ${TERMINOLOGY_BASE_URL}
      VALIDATION_BASE_URL: ${VALIDATION_BASE_URL}
      OPENFDA_BASE_URL: ${OPENFDA_BASE_URL}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL}
      
      # used: internal proxy bases (service-name:container-port) so MCP talks within the Docker network:
      FHIR_PROXY_INTERNAL_BASE: ${FHIR_PROXY_INTERNAL_BASE}/fhir
      TERMINOLOGY_PROXY_INTERNAL_BASE: ${TERMINOLOGY_PROXY_INTERNAL_BASE}
      VALIDATION_PROXY_INTERNAL_BASE: ${VALIDATION_PROXY_INTERNAL_BASE}
      OPENFDA_PROXY_INTERNAL_BASE: ${OPENFDA_PROXY_INTERNAL_BASE}
      SANDBOX_PROXY_INTERNAL_BASE: ${SANDBOX_PROXY_INTERNAL_BASE}
    networks:
      - medschool-net
    healthcheck:
      # use python since the base image is python:3.11-slim
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:${MCP_CONTAINER_PORT}/health'); sys.exit(0)"]
      interval: 5s
      timeout: 5s
      retries: 40
    ports:
      # pin port to loopback to only allow access to host machine
      - "${LOOPBACK_HOST}:${MCP_PORT:-8000}:${MCP_CONTAINER_PORT:-8000}"

  middleman:
    build:
      context: ./docker/middleman
    container_name: medschool-middleman
    restart: unless-stopped
    depends_on:
      hapi:
        condition: service_started
    environment:
      # bind & port
      MIDDLEMAN_PORT: ${MIDDLEMAN_CONTAINER_PORT}
      LOCAL_ADDRESS: ${LOCAL_ADDRESS}

      # client-facing route slugs
      FHIR_ROUTE: ${FHIR_ROUTE}
      TERMINOLOGY_ROUTE: ${TERMINOLOGY_ROUTE}
      VALIDATION_ROUTE: ${VALIDATION_ROUTE}
      OPENFDA_ROUTE: ${OPENFDA_ROUTE}
      MCP_ROUTE: ${MCP_ROUTE}
      SANDBOX_ROUTE: ${SANDBOX_ROUTE}
      VM_ROUTE: ${VM_ROUTE}

      # upstream targets (container-internal URLs)
      FHIR_UPSTREAM_BASE: ${FHIR_UPSTREAM_BASE}
      TERMINOLOGY_UPSTREAM_BASE: ${TERMINOLOGY_UPSTREAM_BASE}
      VALIDATION_UPSTREAM_BASE: ${VALIDATION_UPSTREAM_BASE}
      OPENFDA_UPSTREAM_BASE: ${OPENFDA_UPSTREAM_BASE}
      MCP_UPSTREAM_BASE: ${MCP_UPSTREAM_BASE}
      SANDBOX_UPSTREAM_BASE: ${SANDBOX_UPSTREAM_BASE}
      VM_UPSTREAM_BASE: ${VM_UPSTREAM_BASE}
    ports:
      - "${MIDDLEMAN_PORT:-3000}:${MIDDLEMAN_CONTAINER_PORT:-3000}"
    networks:
      - medschool-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MIDDLEMAN_CONTAINER_PORT}/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  medschool-net:

volumes:
  pgdata:
  # hapi_appdata:
# Docker testing stack; seed import is opt-in via startup.sh --data.
services:

  db:
    image: postgres:15
    container_name: medschool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medschool-net

  hapi:
    mem_limit: 6g # compose (non-swarm) memory limit for this container
    build:
      context: ./docker/fhir_server
    container_name: medschool-hapi
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=40 -XX:MaxRAMPercentage=80 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}

      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/app/config/"  # add to defaults, don't replace
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_CONTEXT_CONFIG: "DEBUG"   # show where config loads from

      REMOTE_TS_ENABLED: ${REMOTE_TS_ENABLED}
      REMOTE_TS_BASE: ${REMOTE_TS_BASE}
      LOCAL_ADDRESS: ${LOCAL_ADDRESS}

    volumes:
      - ./docker/fhir_server/config:/app/config:ro
    healthcheck:
      test: ["CMD", "/busybox", "nc", "-z", "127.0.0.1", "${HAPI_CONTAINER_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      - medschool-net

  validator:
    build:
      context: ./docker/val_server
    container_name: medschool-fhir-validator
    restart: unless-stopped
    environment:
      - TX_SERVER_URL=${TX_SERVER_URL:-https://tx.fhir.org}
      - VALIDATOR_PREWARM=${VALIDATOR_PREWARM:-true}
      - VALIDATOR_PREWARM_SV=${VALIDATOR_PREWARM_SV:-4.0.1}
      - VALIDATOR_PREWARM_TIMEOUT=${VALIDATOR_PREWARM_TIMEOUT:-90}
      - VALIDATOR_STARTUP_WAIT=${VALIDATOR_STARTUP_WAIT:-30}
      - LOCAL_ADDRESS=${LOCAL_ADDRESS}
    networks:
      - medschool-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${VALIDATOR_CONTAINER_PORT}/versions >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      hapi:
        condition: service_started

  validator-prewarm:
    image: curlimages/curl:8.8.0
    container_name: medschool-validator-prewarm
    depends_on:
      validator:
        condition: service_started
    command: ["sh", "-eux", "/scripts/prewarm.sh"]
    environment:
      VALIDATOR_HOST: validator
      VALIDATOR_PORT: ${VALIDATOR_CONTAINER_PORT}
      VALIDATOR_SV: "4.0.1"
      PREWARM_TIMEOUT_SECS: "180"
    volumes:
      - ./docker/val_server/scripts/prewarm.sh:/scripts/prewarm.sh:ro
    networks: [medschool-net]
    restart: "no"

  synthetic_hospital:
    profiles: [seed]
    build:
      context: ./docker/synthetic_hospital
    container_name: medschool-synthetic-hospital
    environment:
      SYNTHETIC_HOSPITAL_SPLIT: ${SYNTHETIC_HOSPITAL_SPLIT:-train}
    volumes:
      - synthetic_hospital_cache:/data
      - synthetic_hospital_fhir:/output
    restart: "no"
    networks:
      - medschool-net

  uploader:
    profiles: [seed]
    build:
      context: ./docker/direct_loader
    container_name: medschool-fhir-db-loader
    depends_on:
      hapi:
        condition: service_healthy
      synthetic_hospital:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: ${DB_CONTAINER_PORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      INPUT_DIR: /seed
      REQUIRE_MATCHING_PATIENTS: "true"
      IMPORT_MODE: ${FHIR_IMPORT_MODE:-append}
      FHIR_BASE_URL: ${HAPI_INTERNAL_FHIR_BASE}
      REINDEX_TIMEOUT_SECONDS: ${REINDEX_TIMEOUT_SECONDS:-3600}
    networks:
      - medschool-net
    volumes:
      - synthetic_hospital_fhir:/seed:ro
    restart: "no"

  mcp:
    build:
      context: ./docker/mcp_server
    container_name: medschool-mcp
    restart: unless-stopped
    depends_on:
      hapi:
        condition: service_healthy
      middleman:
        condition: service_healthy
    environment:
      MCP_HOST: ${MCP_HOST}
      MCP_CONTAINER_PORT: ${MCP_CONTAINER_PORT}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH}

      LOOPBACK_HOST: ${LOOPBACK_HOST}

      FHIR_BASE_URL: ${FHIR_BASE_URL}
      TERMINOLOGY_BASE_URL: ${TERMINOLOGY_BASE_URL}
      VALIDATION_BASE_URL: ${VALIDATION_BASE_URL}
      OPENFDA_BASE_URL: ${OPENFDA_BASE_URL}

      FHIR_PROXY_INTERNAL_BASE: ${FHIR_PROXY_INTERNAL_BASE}/fhir
      TERMINOLOGY_PROXY_INTERNAL_BASE: ${TERMINOLOGY_PROXY_INTERNAL_BASE}
      VALIDATION_PROXY_INTERNAL_BASE: ${VALIDATION_PROXY_INTERNAL_BASE}
      OPENFDA_PROXY_INTERNAL_BASE: ${OPENFDA_PROXY_INTERNAL_BASE}
    networks:
      - medschool-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:${MCP_CONTAINER_PORT}/health'); sys.exit(0)"]
      interval: 5s
      timeout: 5s
      retries: 40
    ports:
      - "${LOOPBACK_HOST}:${MCP_PORT:-8000}:${MCP_CONTAINER_PORT:-8000}"

  alpine_sandbox:
    build:
      context: ./docker/alpine_sandbox
    image: medschool-alpine-sandbox
    container_name: medschool-alpine-builder
    networks:
      - medschool-net

  middleman:
    build:
      context: ./docker/middleman
    container_name: medschool-middleman
    restart: unless-stopped
    depends_on:
      hapi:
        condition: service_started
      alpine_sandbox:
        condition: service_completed_successfully
    environment:
      MIDDLEMAN_PORT: ${MIDDLEMAN_CONTAINER_PORT}
      LOCAL_ADDRESS: ${LOCAL_ADDRESS}

      FHIR_ROUTE: ${FHIR_ROUTE}
      TERMINOLOGY_ROUTE: ${TERMINOLOGY_ROUTE}
      VALIDATION_ROUTE: ${VALIDATION_ROUTE}
      OPENFDA_ROUTE: ${OPENFDA_ROUTE}
      MCP_ROUTE: ${MCP_ROUTE}
      VM_ROUTE: ${VM_ROUTE}

      FHIR_UPSTREAM_BASE: ${FHIR_UPSTREAM_BASE}
      TERMINOLOGY_UPSTREAM_BASE: ${TERMINOLOGY_UPSTREAM_BASE}
      VALIDATION_UPSTREAM_BASE: ${VALIDATION_UPSTREAM_BASE}
      OPENFDA_UPSTREAM_BASE: ${OPENFDA_UPSTREAM_BASE}
      MCP_UPSTREAM_BASE: ${MCP_UPSTREAM_BASE}

      ALPINE_IMAGE: ${ALPINE_IMAGE:-medschool-alpine-sandbox}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-medschool-net}
      ALPINE_MEM_MB: ${ALPINE_MEM_MB:-256}
      ALPINE_CPUS: ${ALPINE_CPUS:-0.5}

    ports:
      - "${MIDDLEMAN_PORT:-3000}:${MIDDLEMAN_CONTAINER_PORT:-3000}"
    networks:
      - medschool-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${MIDDLEMAN_CONTAINER_PORT}/sessions/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  medschool-net:

volumes:
  pgdata:
  synthetic_hospital_cache:
  synthetic_hospital_fhir:

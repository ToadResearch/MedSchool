[project]
name = "medschool_env"
version = "0.1.0"
description = "Train a clinical agent."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "verifiers",
    "python-dotenv",
    "pydantic",
    "requests",
    "httpx",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["main.py"]
[project]
name = "medschool_env"
version = "0.1.0"
description = "Train a clinical agent."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "verifiers",
    "mcp",
    "python-dotenv",
    "fastmcp",
    "pydantic",
    "requests",
    "httpx",
    "anyio",

]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["environment"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

